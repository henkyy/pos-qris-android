name: Debug Patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fix pending refresh lifecycle
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/sales-terminal.tsx')
          text = path.read_text()
          old = """      await saveCatalogCache({ products: ps || [], categories: cs || [], units: us || [], prices: prs || [], stock: bs || [], businessId: business.id, branchId: branch.id, locationId: locationIdNext, cashMethodId: cashMethod?.id || '', paymentMethods: usable, customers: cus || [] } as any)\n      await refreshPending()\n"""
          new = """      await saveCatalogCache({ products: ps || [], categories: cs || [], units: us || [], prices: prs || [], stock: bs || [], businessId: business.id, branchId: branch.id, locationId: locationIdNext, cashMethodId: cashMethod?.id || '', paymentMethods: usable, customers: cus || [] } as any)\n"""
          if old not in text: raise SystemExit('load refresh target not found')
          text = text.replace(old, new, 1)
          old = """  }, [refreshPending, toast])\n\n  const syncPending = useCallback(async () => {\n"""
          new = """  }, [toast])\n\n  const syncPending = useCallback(async () => {\n"""
          if old not in text: raise SystemExit('load dependency target not found')
          text = text.replace(old, new, 1)
          marker = """  const syncPending = useCallback(async () => {\n"""
          insert = """  useEffect(() => { refreshPending() }, [refreshPending])\n\n  const syncPending = useCallback(async () => {\n"""
          if marker not in text: raise SystemExit('sync marker not found')
          text = text.replace(marker, insert, 1)
          path.write_text(text)
      - name: Verify build
        run: npm install && npm run build
      - name: Commit verified patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/sales-terminal.tsx .github/workflows/debug-patch.yml
          git commit -m 'fix(offline): refresh pending count after workspace state' || exit 0
          git rm .github/workflows/debug-patch.yml
          git commit -m 'chore(ci): remove temporary debug patch workflow'
          git push origin main
