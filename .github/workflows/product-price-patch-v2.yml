name: Product Price Patch V2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch ProductCatalog
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('features/products/ProductCatalog.tsx')
          s = p.read_text()
          old = "db.from('product_prices').select('*').eq('price_list_id', lid).in('product_id', ids).is('valid_until', null)"
          new = "db.from('product_prices').select('*').eq('price_list_id', lid).in('product_id', ids).or(`valid_from.is.null,valid_from.lte.${new Date().toISOString()}`).or(`valid_until.is.null,valid_until.gte.${new Date().toISOString()}`)"
          if old not in s:
              raise SystemExit('target query not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove runners
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add features/products/ProductCatalog.tsx .github/workflows/product-price-patch-v2.yml .github/workflows/refactor-product-price-ui.yml
          git commit -m 'fix(products): align active price validity window'
          git rm .github/workflows/product-price-patch-v2.yml .github/workflows/refactor-product-price-ui.yml
          git commit -m 'chore(ci): remove temporary product price patch runners'
          git push origin HEAD:main
