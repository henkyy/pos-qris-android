name: Temporary workspace hardening

on:
  push:
    branches: [backup/pre-reports-offline-hardening-2026-09-05]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch workspace scoping
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, count))

          # Reports: resolve the active stock location from the active branch before querying stock.
          replace('features/reports/index.tsx',
              "const db = requireSupabase(); const { business, branch } = await getActiveWorkspace()\n        const since = new Date();",
              "const db = requireSupabase(); const { business, branch } = await getActiveWorkspace()\n        const { data: locations, error: locationError } = await db.from('locations').select('id,name,code').eq('branch_id', branch.id).eq('is_active', true).order('name').limit(1)\n        if (locationError) throw locationError\n        const activeLocationId = locations?.[0]?.id\n        if (!activeLocationId) throw new Error(`Lokasi stok aktif untuk cabang ${String(branch.name || branch.code || branch.id)} tidak ditemukan.`)\n        const since = new Date()")
          replace('features/reports/index.tsx',
              "db.from('stock_balances').select('product_id,location_id,qty_base,reserved_qty').limit(3000),",
              "db.from('stock_balances').select('product_id,location_id,qty_base,reserved_qty').eq('location_id', activeLocationId).limit(3000),")

          # Dashboard had the same implicit stock scope and therefore needs the same treatment.
          replace('features/dashboard/index.tsx',
              "const { business, branch } = await getActiveWorkspace()\n        const since = new Date()",
              "const { business, branch } = await getActiveWorkspace()\n        const { data: locations, error: locationError } = await db.from('locations').select('id,name,code').eq('branch_id', branch.id).eq('is_active', true).order('name').limit(1)\n        if (locationError) throw locationError\n        const activeLocationId = locations?.[0]?.id\n        if (!activeLocationId) throw new Error(`Lokasi stok aktif untuk cabang ${String(branch.name || branch.code || branch.id)} tidak ditemukan.`)\n        const since = new Date()")
          replace('features/dashboard/index.tsx',
              "db.from('stock_balances').select('product_id,location_id,qty_base,reserved_qty').limit(1000),",
              "db.from('stock_balances').select('product_id,location_id,qty_base,reserved_qty').eq('location_id', activeLocationId).limit(1000),")

          # Offline storage: make the cache workspace-specific and make pending queues scope-aware.
          Path('lib/offline-pos.ts').write_text("""'use client'\n\nexport type OfflinePaymentCode = 'CASH' | 'RECEIVABLE' | 'QRIS' | 'TRANSFER'\n\nexport type OfflineCartItem = {\n  product: Record<string, any>\n  qty: number\n  unit_price: number\n}\n\nexport type OfflineSale = {\n  id: string\n  businessId: string\n  branchId: string\n  locationId: string\n  customerId: string | null\n  items: OfflineCartItem[]\n  paymentMethodId: string\n  paymentCode?: OfflinePaymentCode\n  total: number\n  cashReceived: number\n  reference?: string\n  provider?: string | null\n  discountAmount: number\n  note: string\n  idempotencyKey: string\n  createdAt: string\n}\n\ntype CatalogCache = {\n  products: Record<string, any>[]\n  categories: Record<string, any>[]\n  units: Record<string, any>[]\n  prices: Record<string, any>[]\n  stock: Record<string, any>[]\n  businessId: string\n  branchId: string\n  locationId: string\n  cashMethodId: string\n  paymentMethods?: Record<string, any>[]\n  customers?: Record<string, any>[]\n  cachedAt: string\n}\n\nexport type OfflineScope = {\n  businessId?: string\n  branchId?: string\n  locationId?: string\n}\n\nconst DB_NAME = 'qris-pos-local'\nconst DB_VERSION = 3\nconst SALES_STORE = 'pending-sales'\nconst CATALOG_STORE = 'catalog'\n\nfunction catalogKey(scope: { businessId: string; branchId: string; locationId: string }) {\n  return `catalog:${scope.businessId}:${scope.branchId}:${scope.locationId}`\n}\n\nfunction openDb(): Promise<IDBDatabase> {\n  return new Promise((resolve, reject) => {\n    if (typeof window === 'undefined' || !('indexedDB' in window)) {\n      reject(new Error('Penyimpanan lokal browser tidak tersedia.'))\n      return\n    }\n    const request = indexedDB.open(DB_NAME, DB_VERSION)\n    request.onupgradeneeded = () => {\n      const db = request.result\n      if (!db.objectStoreNames.contains(SALES_STORE)) db.createObjectStore(SALES_STORE, { keyPath: 'id' })\n      if (!db.objectStoreNames.contains(CATALOG_STORE)) db.createObjectStore(CATALOG_STORE, { keyPath: 'id' })\n    }\n    request.onsuccess = () => resolve(request.result)\n    request.onerror = () => reject(request.error || new Error('Gagal membuka penyimpanan lokal.'))\n  })\n}\n\nexport async function saveCatalogCache(cache: Omit<CatalogCache, 'cachedAt'>) {\n  const db = await openDb()\n  return new Promise<void>((resolve, reject) => {\n    const tx = db.transaction(CATALOG_STORE, 'readwrite')\n    tx.objectStore(CATALOG_STORE).put({ ...cache, id: catalogKey(cache), cachedAt: new Date().toISOString() })\n    tx.oncomplete = () => { db.close(); resolve() }\n    tx.onerror = () => { db.close(); reject(tx.error) }\n  })\n}\n\nexport async function getCatalogCache(scope?: OfflineScope): Promise<CatalogCache | null> {\n  const db = await openDb()\n  return new Promise((resolve, reject) => {\n    const store = db.transaction(CATALOG_STORE, 'readonly').objectStore(CATALOG_STORE)\n    const request = scope?.businessId && scope.branchId && scope.locationId\n      ? store.get(catalogKey({ businessId: scope.businessId, branchId: scope.branchId, locationId: scope.locationId }))\n      : store.getAll()\n    request.onsuccess = () => {\n      db.close()\n      if (scope?.businessId || scope?.branchId || scope?.locationId) {\n        const rows = Array.isArray(request.result) ? request.result : request.result ? [request.result] : []\n        const match = rows\n          .filter((row: any) => !scope.businessId || row.businessId === scope.businessId)\n          .filter((row: any) => !scope.branchId || row.branchId === scope.branchId)\n          .filter((row: any) => !scope.locationId || row.locationId === scope.locationId)\n          .sort((a: any, b: any) => String(b.cachedAt || '').localeCompare(String(a.cachedAt || '')))[0]\n        resolve(match || null)\n      } else {\n        const rows = Array.isArray(request.result) ? request.result : []\n        resolve(rows.sort((a: any, b: any) => String(b.cachedAt || '').localeCompare(String(a.cachedAt || '')))[0] || null)\n      }\n    }\n    request.onerror = () => { db.close(); reject(request.error) }\n  })\n}\n\nexport async function enqueueOfflineSale(sale: OfflineSale) {\n  const db = await openDb()\n  return new Promise<void>((resolve, reject) => {\n    const tx = db.transaction(SALES_STORE, 'readwrite')\n    tx.objectStore(SALES_STORE).put(sale)\n    tx.oncomplete = () => { db.close(); resolve() }\n    tx.onerror = () => { db.close(); reject(tx.error) }\n  })\n}\n\nexport async function getPendingOfflineSales(scope?: OfflineScope): Promise<OfflineSale[]> {\n  const db = await openDb()\n  return new Promise((resolve, reject) => {\n    const request = db.transaction(SALES_STORE, 'readonly').objectStore(SALES_STORE).getAll()\n    request.onsuccess = () => {\n      db.close()\n      const rows = (request.result || [])\n        .filter((sale: any) => !scope?.businessId || sale.businessId === scope.businessId)\n        .filter((sale: any) => !scope?.branchId || sale.branchId === scope.branchId)\n        .filter((sale: any) => !scope?.locationId || sale.locationId === scope.locationId)\n        .map((sale: any) => ({\n          ...sale,\n          paymentCode: sale.paymentCode || 'CASH',\n          reference: sale.reference || '',\n          provider: sale.provider ?? null,\n        }))\n        .sort((a: OfflineSale, b: OfflineSale) => a.createdAt.localeCompare(b.createdAt))\n      resolve(rows)\n    }\n    request.onerror = () => { db.close(); reject(request.error) }\n  })\n}\n\nexport async function removeOfflineSale(id: string) {\n  const db = await openDb()\n  return new Promise<void>((resolve, reject) => {\n    const tx = db.transaction(SALES_STORE, 'readwrite')\n    tx.objectStore(SALES_STORE).delete(id)\n    tx.oncomplete = () => { db.close(); resolve() }\n    tx.onerror = () => { db.close(); reject(tx.error) }\n  })\n}\n\nexport async function countPendingOfflineSales(scope?: OfflineScope) {\n  const sales = await getPendingOfflineSales(scope)\n  return sales.length\n}\n""")

          # Sales terminal: preserve the transaction's business/branch/location and use scoped cache/pending reads.
          replace('app/sales-terminal.tsx',
              "import { getActiveWorkspace } from '../lib/business-context'",
              "import { getActiveWorkspace, getStoredBranchId } from '../lib/business-context'")
          replace('app/sales-terminal.tsx',
              "  const [branchId, setBranchId] = useState('')\n  const [locationId, setLocationId] = useState('')",
              "  const [businessId, setBusinessId] = useState('')\n  const [branchId, setBranchId] = useState('')\n  const [locationId, setLocationId] = useState('')")
          replace('app/sales-terminal.tsx',
              "  const refreshPending = useCallback(async () => {\n    try { setPendingCount((await getPendingOfflineSales()).length) } catch {}\n  }, [])",
              "  const refreshPending = useCallback(async () => {\n    try {\n      const { business, branch } = await getActiveWorkspace()\n      setPendingCount((await getPendingOfflineSales({ businessId: business.id, branchId: branch.id })).length)\n    } catch {}\n  }, [])")
          replace('app/sales-terminal.tsx',
              "      setProducts(ps || []); setCategories(cs || []); setUnits(us || []); setStock(bs || []); setCustomers(cus || []); setPaymentMethods(usable); setBranchId(branch.id); setLocationId(locationIdNext);",
              "      setProducts(ps || []); setCategories(cs || []); setUnits(us || []); setStock(bs || []); setCustomers(cus || []); setPaymentMethods(usable); setBusinessId(business.id); setBranchId(branch.id); setLocationId(locationIdNext);")
          replace('app/sales-terminal.tsx',
              "await saveCatalogCache({ products: ps || [], categories: cs || [], units: us || [], prices: prs || [], stock: bs || [], branchId: branch.id, locationId: locationIdNext,",
              "await saveCatalogCache({ products: ps || [], categories: cs || [], units: us || [], prices: prs || [], stock: bs || [], businessId: business.id, branchId: branch.id, locationId: locationIdNext,")
          replace('app/sales-terminal.tsx',
              "const cached = await getCatalogCache().catch(() => null)",
              "const cached = await getCatalogCache({ branchId: getStoredBranchId() || undefined }).catch(() => null)")
          replace('app/sales-terminal.tsx',
              "setProducts(cached.products || []); setCategories(cached.categories || []); setUnits(cached.units || []); setPrices(cached.prices || []); setStock(cached.stock || []); setCustomers((cached as any).customers || []); setPaymentMethods((cached as any).paymentMethods || []); setBranchId(cached.branchId || '');",
              "setProducts(cached.products || []); setCategories(cached.categories || []); setUnits(cached.units || []); setPrices(cached.prices || []); setStock(cached.stock || []); setCustomers((cached as any).customers || []); setPaymentMethods((cached as any).paymentMethods || []); setBusinessId(cached.businessId || ''); setBranchId(cached.branchId || '');")
          replace('app/sales-terminal.tsx',
              "  function localSaleFromCart(idempotencyKey?: string): OfflineSale { return { id: crypto.randomUUID(), branchId, locationId,",
              "  function localSaleFromCart(idempotencyKey?: string): OfflineSale { return { id: crypto.randomUUID(), businessId, branchId, locationId,")
          replace('app/sales-terminal.tsx',
              "const pending = await getPendingOfflineSales()",
              "const pending = await getPendingOfflineSales()")

          # Legacy catalog cache entries from DB v2 are intentionally not reused. They have no business scope.
          print('workspace hardening patch complete')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/reports/index.tsx features/dashboard/index.tsx lib/offline-pos.ts app/sales-terminal.tsx
          git commit -m "fix(workspace): isolate reports and offline POS by outlet" || exit 0
          git push
      - name: Remove temporary runner
        run: |
          git rm .github/workflows/_tmp_workspace_hardening.yml
          git commit -m "chore(ci): remove temporary workspace hardening patch runner"
          git push
