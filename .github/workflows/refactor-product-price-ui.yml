name: Product Price UI Refactor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch ProductCatalog price validity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('features/products/ProductCatalog.tsx')
          s = p.read_text()
          old = "db.from('product_prices').select('*').eq('price_list_id', lid).in('product_id', ids).is('valid_until', null)"
          new = "db.from('product_prices').select('*').eq('price_list_id', lid).in('product_id', ids).or(`valid_from.is.null,valid_from.lte.${new Date().toISOString()}`).or(`valid_until.is.null,valid_until.gte.${new Date().toISOString()}`)"
          if old not in s:
              raise SystemExit('target price query not found')
          # Keep this edit intentionally narrow. Checkout already validates the same time window server-side.
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add features/products/ProductCatalog.tsx
          git commit -m 'fix(products): align active price validity window' || true
          git push origin HEAD:main
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/refactor-product-price-ui.yml
          git commit -m 'chore(ci): remove temporary product price patch workflow'
          git push origin HEAD:main
