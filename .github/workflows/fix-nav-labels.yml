name: Fix navigation labels
on:
  workflow_dispatch:
  push:
    paths:
      - 'components/layout/AppShell.tsx'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix navigation label mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/layout/AppShell.tsx')
          s = p.read_text()
          old = "].map(([id,label,group,description]) => ({ id: id as MenuId, label: label as string, icon: label as string, group: group as GroupId, description: description as string }))"
          new = "].map(([id,icon,group,description]) => ({ id: id as MenuId, label: id as string, icon: icon as string, group: group as GroupId, description: description as string }))"
          if old not in s:
              raise SystemExit('expected navigation mapping not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/layout/AppShell.tsx
          git commit -m 'fix(ui): restore navigation labels' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-nav-labels.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove temporary navigation fix workflow' || true
          git push || true
