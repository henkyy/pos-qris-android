name: Temporary build fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix report syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('features/reports/index.tsx')
          s = p.read_text()
          old = "const since = new Date() since.setHours(0, 0, 0, 0);"
          new = "const since = new Date(); since.setHours(0, 0, 0, 0);"
          if old not in s:
              raise SystemExit('Expected report syntax defect not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/reports/index.tsx
          git commit -m "fix(reports): restore report date statement syntax"
          git push
      - name: Remove temporary runner
        run: |
          git rm .github/workflows/_tmp_fix_build.yml
          git commit -m "chore(ci): remove temporary build fix runner"
          git push
