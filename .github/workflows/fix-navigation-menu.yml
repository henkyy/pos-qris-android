name: Align navigation menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align menu with implemented feature modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/layout/AppShell.tsx')
          text = path.read_text()

          text = re.sub(
              r"type MenuId = .*?\n",
              "type MenuId = 'Dashboard' | 'Penjualan' | 'Pesanan' | 'Pembayaran' | 'Produk' | 'Stok' | 'Pembelian' | 'Supplier' | 'Pelanggan' | 'Piutang' | 'Laporan' | 'Pengaturan'\n",
              text,
              count=1,
          )

          start = text.index('const menus: Menu[] = [')
          end = text.index('\n]\n\nconst mobileMenus', start) + 2
          menu_block = '''const menus: Menu[] = [
            { id: 'Dashboard', label: 'Dashboard', icon: '⌂', group: 'DASHBOARD', desc: 'Ringkasan bisnis outlet aktif' },
            { id: 'Penjualan', label: 'Kasir', icon: '▣', group: 'TRANSAKSI', desc: 'Buat dan proses transaksi penjualan' },
            { id: 'Pesanan', label: 'Pesanan', icon: '◫', group: 'TRANSAKSI', desc: 'Pantau status pesanan penjualan' },
            { id: 'Pembayaran', label: 'Pembayaran', icon: '◉', group: 'TRANSAKSI', desc: 'Pantau pembayaran dan metode pembayaran' },
            { id: 'Produk', label: 'Produk', icon: '□', group: 'INVENTORI', desc: 'Kelola katalog, satuan dan harga produk' },
            { id: 'Stok', label: 'Stok', icon: '▥', group: 'INVENTORI', desc: 'Pantau saldo stok dan koreksi melalui alur persediaan' },
            { id: 'Pembelian', label: 'Pembelian', icon: '⇩', group: 'PEMBELIAN', desc: 'Kelola PO, penerimaan barang dan hutang supplier' },
            { id: 'Supplier', label: 'Supplier', icon: '⇄', group: 'PEMBELIAN', desc: 'Kelola pemasok dan termin pembayaran' },
            { id: 'Pelanggan', label: 'Pelanggan', icon: '♙', group: 'PELANGGAN', desc: 'Kelola data pelanggan dan limit kredit' },
            { id: 'Piutang', label: 'Piutang', icon: 'Rp', group: 'PELANGGAN', desc: 'Pantau tagihan pelanggan dan pembayaran' },
            { id: 'Laporan', label: 'Laporan', icon: '▤', group: 'LAPORAN', desc: 'Analisis penjualan, stok, pembelian dan keuangan' },
            { id: 'Pengaturan', label: 'Pengaturan', icon: '⚙', group: 'SISTEM', desc: 'Konfigurasi bisnis, outlet dan sistem' },
          ]'''
          text = text[:start] + menu_block + text[end:]
          text = text.replace(
              "const groups = ['DASHBOARD', 'TRANSAKSI', 'INVENTORI', 'PEMBELIAN', 'PELANGGAN', 'LAPORAN', 'MANAJEMEN', 'PENGATURAN']",
              "const groups = ['DASHBOARD', 'TRANSAKSI', 'INVENTORI', 'PEMBELIAN', 'PELANGGAN', 'LAPORAN', 'SISTEM']"
          )
          text = text.replace("groups.filter(x => x !== 'DASHBOARD')", "groups.filter(x => x !== 'DASHBOARD')")
          path.write_text(text)
          PY
      - name: Verify navigation consistency
        run: |
          test "$(grep -c "label: 'Kasir'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Pesanan'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Pembayaran'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Produk'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Stok'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Pembelian'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Supplier'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Pelanggan'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Piutang'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Laporan'" components/layout/AppShell.tsx)" -eq 1
          test "$(grep -c "label: 'Pengaturan'" components/layout/AppShell.tsx)" -eq 1
          if grep -q "label: 'Hutang'\|label: 'Pergerakan Stok'\|label: 'Stok Opname'\|label: 'Penyesuaian Stok'\|label: 'Riwayat Transaksi'\|label: 'Purchase Order'\|label: 'Penerimaan Barang'\|label: 'Metode Pembayaran'" components/layout/AppShell.tsx; then
            echo 'Found menu labels without dedicated top-level feature target.'
            exit 1
          fi
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/layout/AppShell.tsx
          git commit -m 'refactor(ui): align menus with implemented feature contents' || exit 0
          git rm .github/workflows/fix-navigation-menu.yml
          git commit -m 'chore(ci): remove temporary navigation fixer'
          git push origin main
