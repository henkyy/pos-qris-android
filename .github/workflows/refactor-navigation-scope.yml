name: Refactor navigation scope
on:
  push:
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor AppShell menu targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/layout/AppShell.tsx')
          t = p.read_text()
          block = '''type MenuId = 'Dashboard' | 'Kasir' | 'Penjualan' | 'Pesanan' | 'Pembayaran' | 'Produk' | 'Stok' | 'Pembelian' | 'Supplier' | 'Pelanggan' | 'Piutang' | 'Laporan' | 'Pengaturan'
type ViewMode = 'retail' | 'distributor' | 'fnb'
type Menu = { id: MenuId; label: string; icon: string; group: string; desc: string; disabled?: boolean }
type Branch = Record<string, any>

const menus: Menu[] = [
  { id: 'Dashboard', label: 'Dashboard', icon: '⌂', group: 'DASHBOARD', desc: 'Ringkasan bisnis' },
  { id: 'Kasir', label: 'Kasir', icon: '▣', group: 'TRANSAKSI', desc: 'Transaksi penjualan' },
  { id: 'Penjualan', label: 'Penjualan', icon: '▤', group: 'TRANSAKSI', desc: 'Riwayat penjualan', disabled: true },
  { id: 'Pesanan', label: 'Pesanan', icon: '◫', group: 'TRANSAKSI', desc: 'Pesanan berjalan' },
  { id: 'Pembayaran', label: 'Pembayaran', icon: '◉', group: 'TRANSAKSI', desc: 'Status pembayaran' },
  { id: 'Produk', label: 'Produk', icon: '□', group: 'INVENTORI', desc: 'Produk, satuan, kategori & harga' },
  { id: 'Stok', label: 'Stok', icon: '▥', group: 'INVENTORI', desc: 'Persediaan & mutasi stok' },
  { id: 'Pembelian', label: 'Pembelian', icon: '⇩', group: 'PEMBELIAN', desc: 'Purchase order, penerimaan & hutang' },
  { id: 'Supplier', label: 'Supplier', icon: '⇄', group: 'PEMBELIAN', desc: 'Pemasok barang' },
  { id: 'Pelanggan', label: 'Pelanggan', icon: '♙', group: 'PELANGGAN', desc: 'Pelanggan & riwayat transaksi' },
  { id: 'Piutang', label: 'Piutang', icon: 'Rp', group: 'PELANGGAN', desc: 'Tagihan pelanggan' },
  { id: 'Laporan', label: 'Laporan', icon: '▥', group: 'LAPORAN', desc: 'Penjualan, pembelian, stok & profitabilitas' },
  { id: 'Pengaturan', label: 'Pengaturan', icon: '⚙', group: 'SISTEM', desc: 'Bisnis, outlet, QRIS & konfigurasi sistem' },
]

const mobileMenus = menus.filter(x => ['Dashboard', 'Kasir', 'Stok', 'Laporan'].includes(x.id))
const groups = ['DASHBOARD', 'TRANSAKSI', 'INVENTORI', 'PEMBELIAN', 'PELANGGAN', 'LAPORAN', 'SISTEM']

'''
          t, n = re.subn(r"type MenuId =.*?const groups = \[[\s\S]*?\]\n\n", block, t, count=1)
          if n != 1: raise SystemExit('menu block not found')
          render = '''function renderFeature(active: MenuId, mode: ViewMode, workspaceVersion: number) {
  const key = `${workspaceVersion}-${mode}`
  switch (active) {
    case 'Dashboard': return <DashboardPage key={key} />
    case 'Kasir': return <SalesTerminal key={key} />
    case 'Pesanan': return <OrdersPage key={key} />
    case 'Produk': return <ProductsPage key={key} />
    case 'Stok': return <InventoryPage key={key} />
    case 'Pelanggan': return <CustomersPage key={key} />
    case 'Supplier': return <SuppliersPage key={key} />
    case 'Pembelian': return <PurchasesPage key={key} />
    case 'Piutang': return <ReceivablesPage key={key} />
    case 'Laporan': return <ReportsPage key={key} />
    case 'Pembayaran': return <PaymentsPage key={key} />
    case 'Pengaturan': return <SettingsPage key={key} />
    case 'Penjualan': return <SalesTerminal key={key} />
  }
}

'''
          t, n = re.subn(r"function renderFeature\(active: MenuId, mode: ViewMode, workspaceVersion: number\) \{[\s\S]*?\n\}\n\n", render, t, count=1)
          if n != 1: raise SystemExit('render block not found')
          t = t.replace("const [active, setActive] = useState<MenuId>('Penjualan')", "const [active, setActive] = useState<MenuId>('Dashboard')")
          t = t.replace("const disabled = 'disabled' in menu && Boolean((menu as Menu & { disabled?: boolean }).disabled)", "const disabled = Boolean(menu.disabled)")
          p.write_text(t)
          PY
          npm install --no-audit --no-fund
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/layout/AppShell.tsx
          git diff --cached --quiet || git commit -m "refactor(ui): separate navigation menu targets"
          git push origin HEAD:main
      - name: Remove workflow
        if: always()
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/refactor-navigation-scope.yml || true
          git rm -f .github/workflows/refactor-navigation-scope.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary navigation workflow" || true
          git push origin HEAD:main || true
